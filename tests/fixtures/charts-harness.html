<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanduo Charts test harness</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      :root {
        --vd-bg-primary: #ffffff;
        --vd-bg-secondary: #f8f9fa;
        --vd-border-color: #dee2e6;
        --vd-border-color-light: #e9ecef;
        --vd-text-primary: #1a1d20;
        --vd-text-muted: #868e96;
        --vd-color-primary: #364fc7;
        --vd-color-info: #0b7285;
        --vd-color-success: #2b8a3e;
        --vd-chart-1: #364fc7;
        --vd-chart-2: #0b7285;
        --vd-chart-3: #2b8a3e;
      }

      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
      }

      .mount {
        width: 720px;
        height: 360px;
        margin-bottom: 24px;
      }
    </style>
    <script>
      window.Vanduo = {
        components: {},
        register(name, component) {
          this.components[name] = component;
        },
        queryAll(root, selector) {
          const scope = root || document;
          const matches = [];
          if (scope instanceof Element && scope.matches(selector)) {
            matches.push(scope);
          }
          if (scope.querySelectorAll) {
            scope.querySelectorAll(selector).forEach((el) => matches.push(el));
          }
          return matches;
        },
        init(root) {
          Object.values(this.components).forEach((component) => {
            if (component && typeof component.init === 'function') {
              component.init(root || document);
            }
          });
        },
        destroy(root) {
          Object.values(this.components).forEach((component) => {
            if (component && typeof component.destroyAll === 'function') {
              component.destroyAll(root || document);
            }
          });
        },
        reinit(name, root) {
          const component = this.components[name];
          if (!component) return;
          if (typeof component.destroyAll === 'function') component.destroyAll(root || document);
          if (typeof component.init === 'function') component.init(root || document);
        }
      };
    </script>
  </head>
  <body>
    <div id="bar" class="mount"></div>
    <div id="line" class="mount"></div>
    <div id="area" class="mount"></div>
    <div id="scatter" class="mount"></div>
    <div id="donut" class="mount"></div>
    <div id="pie" class="mount"></div>
    <div id="responsive" class="mount"></div>

    <script type="application/json" id="auto-data">
      [
        { "channel": "Product", "revenue": 420 },
        { "channel": "Services", "revenue": 180 },
        { "channel": "Support", "revenue": 90 }
      ]
    </script>
    <div
      id="auto-chart"
      class="mount"
      data-vd-chart="donut"
      data-vd-chart-data="#auto-data"
      data-vd-label="channel"
      data-vd-value="revenue"
      data-vd-title="Auto donut"
    ></div>

    <script type="module">
      import * as charts from '/src/index.js';

      const sales = [
        { month: 'Jan', value: 120 },
        { month: 'Feb', value: 180 },
        { month: 'Mar', value: null },
        { month: 'Apr', value: 150 }
      ];
      const points = [
        { x: 1, y: 12, group: 'A' },
        { x: 2, y: 18, group: 'B' },
        { x: 3, y: 15, group: 'A' },
        { x: 4, y: 23, group: 'B' }
      ];
      const mix = [
        { channel: 'Product', revenue: 420 },
        { channel: 'Services', revenue: 180 },
        { channel: 'Support', revenue: 90 }
      ];

      window.chartClicks = [];
      window.charts = charts;
      window.sampleData = { sales, points, mix };

      window.renderBar = () => charts.BarChart({
        target: '#bar',
        data: sales,
        x: 'month',
        y: 'value',
        title: 'Sales',
        tooltip: (d) => `${d.month}: ${d.value}`,
        onBarClick: ({ datum }) => window.chartClicks.push(datum.month)
      });

      window.renderLine = () => charts.LineChart({
        target: '#line',
        data: sales,
        x: 'month',
        y: 'value',
        title: 'Sales trend'
      });

      window.renderArea = () => charts.AreaChart({
        target: '#area',
        data: sales,
        x: 'month',
        y: 'value',
        title: 'Sales area'
      });

      window.renderScatter = () => charts.ScatterChart({
        target: '#scatter',
        data: points,
        x: 'x',
        y: 'y',
        color: 'group',
        title: 'Scatter'
      });

      window.renderDonut = () => charts.DonutChart({
        target: '#donut',
        data: mix,
        label: 'channel',
        value: 'revenue',
        title: 'Revenue mix',
        onSliceClick: ({ datum }) => window.chartClicks.push(datum.channel)
      });

      window.renderPie = () => charts.PieChart({
        target: '#pie',
        data: mix,
        label: 'channel',
        value: 'revenue',
        title: 'Revenue pie'
      });

      window.renderResponsive = () => charts.BarChart({
        target: '#responsive',
        data: sales,
        x: 'month',
        y: 'value',
        title: 'Responsive'
      });
    </script>
  </body>
</html>
